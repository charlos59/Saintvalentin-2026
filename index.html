<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour Lamia ma princesse que j'aime ❤️</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600&display=swap');

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            background-color: #ffe6eb; /* Fallback rose */
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            text-align: center;
            color: #4a4a4a;
        }

        /* Arrière-plan animé */
        .bg-hearts {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        .heart-bg {
            position: absolute;
            color: #ffb7c5;
            animation: float 15s infinite linear;
            font-size: 20px;
            opacity: 0.6;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-10vh) rotate(360deg); }
        }

        /* Conteneur principal */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(255, 105, 180, 0.2);
            width: 90%;
            max-width: 400px;
            position: relative;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            color: #d81b60;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        p { font-size: 1.1rem; margin-bottom: 25px; }

        /* Boutons */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            position: relative;
            min-height: 60px;
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-yes { background: #ff4081; color: white; }
        .btn-no { background: #e0e0e0; color: #555; position: relative; }
        .btn-future { 
            background: linear-gradient(45deg, #ff4081, #ff9a9e); 
            color: white; 
            margin-top: 20px; 
            width: 100%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Sections cachées */
        .hidden { display: none; }

        /* Image bague */
        .ring-img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Animation d'apparition */
        .fade-in { animation: fadeIn 1s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    </style>
</head>
<body>

    <div class="bg-hearts" id="bgHearts"></div>

    <audio id="loveSong" loop>
        <source src="https://cdn.pixabay.com/audio/2022/02/07/audio_13b6329766.mp3" type="audio/mpeg">
    </audio>

    <div class="card" id="step1">
        <h1>Ma magnifique Lamia ❤️</h1>
        <p>Je voulais te demander quelque chose de spécial...</p>
        <p><strong>Veux-tu être ma Valentine cette année ?</strong></p>
        
        <div class="btn-container">
            <button class="btn-yes" onclick="goToStep2()">OUI ! 😍</button>
            <button class="btn-no" id="btnNo">NON 😢</button>
        </div>
    </div>

    <div class="card hidden fade-in" id="step2">
        <h1>Tu as fait le bon choix ! 🌹</h1>
        <p>Je t'aime plus que tout ! 🎉</p>
        <p>Mais ce n'est pas fini...</p>
        <button class="btn-future" onclick="goToStep3()">Découvrir notre avenir ✨</button>
    </div>

    <div class="card hidden fade-in" id="step3">
        <img src="https://images.unsplash.com/photo-1515934751635-c81c6bc9a2d8?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Bague de mariage" class="ring-img">
        
        <h1>Une promesse... 💍</h1>
        <p style="font-size: 1.2rem; line-height: 1.6;">
            "Un jour je te marierai et on vivra cette vie ensemble."
        </p>
        <p style="color: #ff4081; font-weight: bold;">Je t'aime Lamia.</p>
    </div>

    <script>
        // Création des coeurs flottants
        const heartsContainer = document.getElementById('bgHearts');
        for(let i=0; i<30; i++) {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 10 + 10) + 's';
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';
            heartsContainer.appendChild(heart);
        }

        // Gestion du bouton NON qui s'enfuit
        const btnNo = document.getElementById('btnNo');
        const moveBtn = (e) => {
            e.preventDefault();
            const card = document.querySelector('.card');
            const cardRect = card.getBoundingClientRect();
            
            // Calcul pour garder le bouton DANS la carte ou proche
            const x = Math.random() * (cardRect.width - 100);
            const y = Math.random() * (cardRect.height - 50);
            
            btnNo.style.position = 'absolute';
            btnNo.style.left = x + 'px';
            btnNo.style.top = y + 'px';
        };
        btnNo.addEventListener('mouseover', moveBtn);
        btnNo.addEventListener('touchstart', moveBtn);
        btnNo.addEventListener('click', moveBtn);

        // Passage à l'étape 2 (Musique + Confettis)
        function goToStep2() {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            
            // Lancer la musique
            const audio = document.getElementById('loveSong');
            audio.volume = 0.5;
            audio.play().catch(e => console.log("Lecture auto bloquée : " + e));

            // Confettis
            const duration = 3000;
            const end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff4081', '#ff9a9e'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff4081', '#ff9a9e'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        // Passage à l'étape 3 (Bague)
        function goToStep3() {
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.remove('hidden');
            // Relancer un petit coup de confettis dorés pour la bague
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#FFD700', '#FFA500'] });
        }
    </script>
</body>
</html>
