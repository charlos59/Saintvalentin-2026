<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pour ma magnifique Lamia ❤️</title>
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;700&display=swap');

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffe0f0 0%, #ffc0cb 100%);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            text-align: center;
            color: #4a4a4a;
            position: relative;
        }

        .heart-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        
        /* Cœurs d'arrière-plan */
        .heart {
            position: absolute;
            background-color: rgba(255, 105, 180, 0.7);
            transform: rotate(-45deg);
            animation: floatHeart 10s infinite ease-in;
            opacity: 0;
            z-index: 0;
        }
        .heart::before, .heart::after {
            content: "";
            position: absolute;
            background-color: rgba(255, 105, 180, 0.7);
            border-radius: 50%;
            width: 100%;
            height: 100%;
        }
        .heart::before { top: -50%; left: 0; }
        .heart::after { top: 0; left: 50%; }

        @keyframes floatHeart {
            0% { transform: translateY(100vh) rotate(-45deg); opacity: 0; }
            25% { opacity: 1; }
            50% { transform: translateY(50vh) rotate(-45deg); }
            75% { opacity: 1; }
            100% { transform: translateY(-20vh) rotate(-45deg); opacity: 0; }
        }

        #main-content {
            z-index: 10;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }

        h1 {
            font-family: 'Pacifico', cursive;
            color: #d81b60;
            font-size: 2rem;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        /* Conteneur des boutons en Flexbox pour qu'ils soient alignés */
        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            position: relative;
            min-height: 60px; /* Espace réservé */
        }

        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            /* Important pour que le tactile fonctionne bien */
            touch-action: manipulation; 
        }

        #yesBtn {
            background-color: #66bb6a;
            color: white;
            z-index: 20;
        }

        #noBtn {
            background-color: #ef5350;
            color: white;
            position: relative; /* Position normale au début */
            transition: top 0.2s, left 0.2s; /* Mouvement fluide */
            z-index: 15;
        }

        #final-message {
            display: none;
            z-index: 100;
            color: #d81b60;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            font-family: 'Pacifico', cursive;
            font-size: 1.8rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
        }
    </style>
</head>
<body>
    
    <div class="heart-animation" id="heartContainer"></div>

    <div id="main-content">
        <h1>Ma magnifique Lamia, ❤️</h1>
        <p style="font-size: 1.1rem; margin-bottom: 20px;">Veux-tu être ma Valentine cette année ?</p>
        
        <div class="buttons-container">
            <button id="yesBtn" onclick="celebrate()">OUI ! 😍</button>
            <button id="noBtn">NON 😟</button>
        </div>
    </div>

    <div id="final-message">
        Tu as fait le bon choix ! ❤️<br>
        Je t'aime Lamia ! 🎉<br><br>
        <a href="https://open.spotify.com/track/47EiUVwCH4LD0ksySywGuy?si=e2f8c5b0b8b84b8b" target="_blank" style="color: #d81b60; text-decoration: underline; font-size: 1.2rem;">Clique ici pour la musique ! 🎶</a>
    </div>

    <audio id="confettiSound" src="https://assets.mixkit.co/sfx/preview/mixkit-small-fanfare-celebration-2731.mp3" preload="auto"></audio>

    <script>
        // CŒURS D'ARRIÈRE-PLAN
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            document.getElementById('heartContainer').appendChild(heart);
            const size = Math.random() * 20 + 10;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 5 + 5 + 's';
            setTimeout(() => { heart.remove(); }, 8000);
        }
        setInterval(createHeart, 400);

        // LOGIQUE DU BOUTON FUYANT
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        // Fonction pour bouger le bouton
        function moveButton() {
            // Passe en position absolue dès le premier mouvement
            noBtn.style.position = 'fixed'; 
            
            // Calculer les limites de l'écran (avec une marge de sécurité)
            const margin = 50;
            const maxX = window.innerWidth - noBtn.offsetWidth - margin;
            const maxY = window.innerHeight - noBtn.offsetHeight - margin;

            const newX = Math.random() * (maxX - margin) + margin;
            const newY = Math.random() * (maxY - margin) + margin;

            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';
        }

        // Déclencheurs pour PC (souris) et Mobile (toucher)
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Empêche le clic
            moveButton();
        });
        noBtn.addEventListener('click', (e) => {
            e.preventDefault();
            moveButton();
        });

        // CÉLÉBRATION
        function celebrate() {
            document.getElementById('main-content').style.display = 'none';
            document.getElementById('final-message').style.display = 'block';
            
            // Son
            document.getElementById('confettiSound').play().catch(e => console.log("Audio bloqué par le navigateur"));

            // Confettis
            const duration = 5000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff69b4', '#d81b60'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff69b4', '#d81b60'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }
    </script>
</body>
</html>
